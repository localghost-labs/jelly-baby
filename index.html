<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="canonical" href="https://jelly.scottsun.io" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8d9c3" />
    <script>
      // Two facts the rest of the document keys on, locked before any resource is
      // discovered so preload and runtime agree. `?embed=1` is the Smashbar
      // backdrop (src/app/scene-config.ts); anything else is the playroom.
      document.documentElement.dataset.jellyMode=new URLSearchParams(location.search).get('embed')==='1'?'embed':'full'
      document.documentElement.dataset.jellyPlatform=matchMedia('(pointer: coarse)').matches?'mobile':'desktop'
    </script>
    <!-- Every item below is mandatory for the first playable frame. Discover
         them before the module graph/WebGPU initialization so transfer/decode
         overlaps boot instead of starting only after renderer creation. -->
    <link rel="preload" href="/src/assets/bg_room_studio.rgba16f" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/src/assets/model/jelly-baby.bin" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/src/assets/model/jelly-baby.json" as="fetch" crossorigin="anonymous" />
    <!-- Mode-specific items ship with an inert rel and are promoted to preload
         by the script below. Removing a real preload after the fact would not
         stop a fetch the parser had already started — and the desktop wood is
         14 MB the embed never uses. -->
    <link rel="jelly-preload" data-jelly-mode="full" href="/src/assets/night.rgba16f" as="fetch" crossorigin="anonymous" />
    <link rel="jelly-preload" data-jelly-mode="full" href="/src/assets/wood_texture/wood_base.jpg" as="image" crossorigin="anonymous" media="(pointer: fine), (pointer: none)" data-jelly-platform="desktop" />
    <link rel="jelly-preload" data-jelly-mode="full" href="/src/assets/wood_texture/wood_base_4k.jpg" as="image" crossorigin="anonymous" media="(pointer: coarse)" data-jelly-platform="mobile" />
    <link rel="jelly-preload" data-jelly-mode="full" href="/src/assets/wood_texture/wood_normal.png" as="image" crossorigin="anonymous" />
    <link rel="jelly-preload" data-jelly-mode="full" href="/src/assets/wood_texture/wood_roughness.jpg" as="image" crossorigin="anonymous" />
    <link rel="jelly-preload" data-jelly-mode="embed" href="/src/assets/smush-mark.png" as="image" crossorigin="anonymous" />
    <script>
      for(const link of document.querySelectorAll('[data-jelly-platform]'))if(link.dataset.jellyPlatform!==document.documentElement.dataset.jellyPlatform)link.remove()
      for(const link of document.querySelectorAll('[data-jelly-mode]')){if(link.dataset.jellyMode===document.documentElement.dataset.jellyMode)link.rel='preload';else link.remove()}
    </script>
    <meta name="description" content="A small, soft world. Wander, hop, stretch, and let go." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jelly.scottsun.io" />
    <meta property="og:title" content="Jelly Baby" />
    <meta property="og:description" content="A small, soft world. Wander, hop, stretch, and let go." />
    <meta property="og:image" content="https://jelly.scottsun.io/og_image.png" />
    <meta property="og:image:alt" content="Jelly Baby" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jelly Baby" />
    <meta name="twitter:description" content="A small, soft world. Wander, hop, stretch, and let go." />
    <meta name="twitter:image" content="https://jelly.scottsun.io/og_image.png" />
    <title>Jelly Baby</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Jelly Baby needs JavaScript and a WebGPU-capable browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
