name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The Smashbar embed's first-visit transfer must stay under 10 MB
      # compressed (scripts/check-embed-budget.mjs). A regression fails here,
      # in the repository that caused it.
      - run: npm run check:embed-budget
